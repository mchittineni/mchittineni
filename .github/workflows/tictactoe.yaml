name: 🎮 Tic-Tac-Toe

# Each square in the README opens an issue titled "ttt|move|<team>|<square>".
# This plays the move, commits the new board, replies on the issue and closes it.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  move:
    name: Play move
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Play move and commit board
        id: play
        env:
          # Untrusted input: only ever read from env, never interpolated into the script.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Two players can move at the same moment. Rather than queueing runs (GitHub
          # drops all but one pending run per concurrency group), replay the move on
          # the latest board and retry the push.
          status=3
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 tictactoe/game.py > result.md && status=0 || status=$?
            [ "$status" -ne 0 ] && break
            git add README.md tictactoe/state.json
            git commit --quiet -m "chore(tictactoe): move by ${ISSUE_USER} [skip ci]"
            git push --quiet origin HEAD:main && break
            status=3  # push rejected: someone else's move landed first
            sleep $(( attempt * 2 ))
          done

          if [ "$status" -eq 3 ]; then
            echo "⚠️ The board couldn't be saved because lots of moves landed at once. Please refresh the profile and try again." > result.md
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Reply and close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.play.outputs.status }}
        run: |
          [ -s result.md ] || echo "⚠️ Something went wrong playing this move. Please try again." > result.md
          printf '\n\n[Back to the board](https://github.com/%s#-community-tic-tac-toe)\n' "$GITHUB_REPOSITORY" >> result.md
          gh issue comment "$ISSUE_NUMBER" --body-file result.md
          if [ "$STATUS" = "0" ]; then reason=completed; else reason="not planned"; fi
          gh issue close "$ISSUE_NUMBER" --reason "$reason"
